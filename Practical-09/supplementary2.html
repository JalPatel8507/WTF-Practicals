
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Search Application</title>
    <link rel="stylesheet" href="supplementary2.css">
</head>
<body>

    <div class="container">
        <h1>Online Book Search</h1>
        <p>Search for your favourite books online.</p>

        <div class="search-box">
            <input type="text" id="bookInput"
                placeholder="Enter book title or author">
            <button onclick="searchBooks()">Search</button>
        </div>

        <div id="bookResults" class="book-results">
            <p>Search for a book to see its details.</p>
        </div>
    </div>

    <script src="supplementary2.js"></script>
</body>
</html>
