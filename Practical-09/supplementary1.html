
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Information Portal</title>
    <link rel="stylesheet" href="supplementary1.css">
</head>
<body>

    <div class="container">
        <h1>Weather Information Portal</h1>
        <p>Check current weather information of any city.</p>

        <div class="search-box">
            <input type="text" id="cityInput" placeholder="Enter city name">
            <button onclick="getWeather()">Search</button>
        </div>

        <div id="weatherResult" class="weather-card">
            <p>Enter a city to check its weather.</p>
        </div>
    </div>

    <script src="supplementary1.js"></script>
</body>
</html>
