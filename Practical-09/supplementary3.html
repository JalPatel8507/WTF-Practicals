
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Information System</title>
    <link rel="stylesheet" href="supplementary3.css">
</head>
<body>

    <div class="container">
        <h1>Movie Information System</h1>
        <p>Search for movies and explore their details.</p>

        <div class="search-box">
            <input type="text" id="movieInput"
                placeholder="Enter movie or TV show name">
            <button onclick="searchMovies()">Search</button>
        </div>

        <div id="movieResults" class="movie-results">
            <p>Search for a title to see its information.</p>
        </div>
    </div>

    <script src="supplementary3.js"></script>
</body>
</html>
