
<!DOCTYPE html>
<html>
<head>
    <title>Movie Explorer</title>
    <link rel="stylesheet" href="supplementary3.css">
</head>
<body>

    <div class="container">
        <h1>Movie Explorer</h1>

        <label>Select Your Preferred Genre:</label>

        <select id="genre" onchange="getMovies()">
            <option value="">Select Genre</option>
            <option value="Action">Action</option>
            <option value="Comedy">Comedy</option>
            <option value="Drama">Drama</option>
            <option value="Horror">Horror</option>
            <option value="Romance">Romance</option>
            <option value="Science-Fiction">Science Fiction</option>
        </select>

        <button onclick="getMovies()">Explore Movies</button>

        <div id="movieList">
            <p>Select a genre to explore movies.</p>
        </div>
    </div>

    <script src="supplementary3.js"></script>
</body>
</html>
