
<!DOCTYPE html>
<html>
<head>
    <title>Movie Ticket Booking</title>
    <link rel="stylesheet" href="supplementary2.css">
</head>
<body>

    <div class="container">
        <h1>Movie Ticket Booking</h1>

        <h3>Select Your Seats</h3>

        <div class="screen">SCREEN</div>

        <div class="seats" id="seats"></div>

        <h3>Booking Summary</h3>

        <p>Selected Seats: <span id="selected">None</span></p>
        <p>Total Tickets: <span id="count">0</span></p>
        <p>Total Amount: ₹<span id="total">0</span></p>

        <button onclick="bookTickets()">Book Tickets</button>

        <p id="message"></p>
    </div>

    <script src="supplementary2.js"></script>
</body>
</html>
