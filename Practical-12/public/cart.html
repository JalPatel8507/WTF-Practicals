
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart | FoodExpress</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">FoodExpress 🍽️</a>

            <div>
                <a href="index.html" class="btn btn-outline-light me-2">Home</a>
                <a href="menu.html" class="btn btn-warning">Menu</a>
            </div>
        </div>
    </nav>

    <!-- Shopping Cart -->
    <div class="container py-5">

        <h1 class="text-center mb-4">Your Shopping Cart 🛒</h1>

        <div class="card shadow p-4">

            <div class="table-responsive">
                <table class="table table-bordered text-center align-middle">

                    <thead class="table-dark">
                        <tr>
                            <th>Food Item</th>
                            <th>Price</th>
                            <th>Quantity</th>
                            <th>Subtotal</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody id="cartItems">
                        <!-- Cart items will appear here -->
                    </tbody>

                </table>
            </div>

            <div class="text-end mt-3">
                <h4>Total: ₹<span id="cartTotal">0</span></h4>

                <button class="btn btn-danger me-2" id="clearCart">
                    Clear Cart
                </button>

                <button class="btn btn-orange" id="placeOrder">
                    Place Order
                </button>
            </div>

            <p id="cartMessage" class="text-center mt-3"></p>

        </div>

        <div class="text-center mt-4">
            <a href="menu.html" class="btn btn-outline-dark">
                Continue Shopping
            </a>
        </div>

    </div>

    <footer class="text-center">
        <p>© 2026 FoodExpress. All Rights Reserved.</p>
    </footer>

    <script src="js/script.js"></script>

</body>
</html>
