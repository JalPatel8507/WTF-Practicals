
<!DOCTYPE html>
<html>
<head>
    <title>Student Result Calculator</title>
    <link rel="stylesheet" href="supplementary1.css">
</head>
<body>

    <div class="container">
        <h1>Student Result Calculator</h1>

        <label>Student Name:</label>
        <input type="text" id="name" placeholder="Enter student name">

        <label>Enter Marks (out of 100):</label>
        <input type="number" id="m1" placeholder="Subject 1">
        <input type="number" id="m2" placeholder="Subject 2">
        <input type="number" id="m3" placeholder="Subject 3">
        <input type="number" id="m4" placeholder="Subject 4">
        <input type="number" id="m5" placeholder="Subject 5">

        <button onclick="calculateResult()">Calculate Result</button>

        <div id="result"></div>
    </div>

    <script src="supplementary1.js"></script>
</body>
</html>
