
<!DOCTYPE html>
<html>
<head>
    <title>Shopping Bill Generator</title>
    <link rel="stylesheet" href="supplementary3.css">
</head>
<body>

    <div class="container">
        <h1>Shopping Bill Generator</h1>

        <label>Customer Name:</label>
        <input type="text" id="name" placeholder="Enter customer name">

        <label>Product Name:</label>
        <input type="text" id="product" placeholder="Enter product name">

        <label>Quantity:</label>
        <input type="number" id="quantity" placeholder="Enter quantity">

        <label>Price per Item (₹):</label>
        <input type="number" id="price" placeholder="Enter price">

        <label>Discount (%):</label>
        <input type="number" id="discount" placeholder="Enter discount">

        <label>GST (%):</label>
        <input type="number" id="gst" placeholder="Enter GST">

        <button onclick="generateBill()">Generate Bill</button>

        <div id="result"></div>
    </div>

    <script src="supplementary3.js"></script>
</body>
</html>
