
<!DOCTYPE html>
<html>
<head>
    <title>Employee Registration Portal</title>
    <link rel="stylesheet" href="supplementary2.css">
</head>
<body>

    <div class="container">
        <h1>Employee Registration Portal</h1>

        <form id="employeeForm">

            <label>Employee ID:</label>
            <input type="text" id="empId" placeholder="Enter employee ID" required>

            <label>Full Name:</label>
            <input type="text" id="name" placeholder="Enter full name" required>

            <label>Email Address:</label>
            <input type="email" id="email" placeholder="Enter email" required>

            <label>Mobile Number:</label>
            <input type="text" id="mobile" placeholder="10-digit mobile number" required>

            <label>Monthly Salary (₹):</label>
            <input type="number" id="salary" placeholder="Enter salary" required>

            <label>Password:</label>
            <input type="password" id="password" placeholder="Minimum 8 characters" required>

            <label>Confirm Password:</label>
            <input type="password" id="confirmPassword" placeholder="Confirm password" required>

            <button type="submit">Register Employee</button>

        </form>

        <p id="message"></p>
    </div>

    <script src="supplementary2.js"></script>
</body>
</html>
