
<!DOCTYPE html>
<html>
<head>
    <title>Student Admission Form</title>
    <link rel="stylesheet" href="supplementary1.css">
</head>
<body>

    <div class="container">
        <h1>Student Admission Form</h1>

        <form id="admissionForm">

            <h2>Personal Information</h2>

            <label>Full Name:</label>
            <input type="text" id="name" placeholder="Enter full name" required>

            <label>Email Address:</label>
            <input type="email" id="email" placeholder="Enter email" required>

            <label>Mobile Number:</label>
            <input type="text" id="mobile" placeholder="10-digit mobile number" required>

            <label>Date of Birth:</label>
            <input type="date" id="dob" required>

            <label>Gender:</label>
            <select id="gender" required>
                <option value="">Select Gender</option>
                <option>Male</option>
                <option>Female</option>
                <option>Other</option>
            </select>

            <h2>Academic Information</h2>

            <label>Previous School:</label>
            <input type="text" id="school" required>

            <label>12th Percentage:</label>
            <input type="number" id="percentage" min="0" max="100" required>

            <label>Course:</label>
            <select id="course" required>
                <option value="">Select Course</option>
                <option>B.Tech IT</option>
                <option>B.Tech Computer Science</option>
                <option>BCA</option>
                <option>BBA</option>
            </select>

            <button type="submit">Submit Application</button>

        </form>

        <p id="message"></p>
    </div>

    <script src="supplementary1.js"></script>
</body>
</html>
