
<!DOCTYPE html>
<html>
<head>
    <title>CityCare Hospital - Patient Registration</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eaf2f8;
            margin: 0;
            padding: 20px;
        }

        .container {
            width: 550px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        h2 {
            text-align: center;
            color: #176b87;
        }

        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
        }

        input, select, textarea {
            width: 100%;
            padding: 9px;
            margin-top: 5px;
            box-sizing: border-box;
            border: 1px solid #aaa;
            border-radius: 5px;
        }

        .options input {
            width: auto;
        }

        button {
            background-color: #176b87;
            color: white;
            padding: 12px;
            border: none;
            width: 100%;
            margin-top: 20px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #104b60;
        }

        #message {
            text-align: center;
            font-weight: bold;
            margin-top: 15px;
        }

        .error {
            color: red;
        }

        .success {
            color: green;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>CityCare Hospital</h2>
    <h3>Patient Registration Form</h3>

    <form id="patientForm" novalidate>

        <label>Full Name:</label>
        <input type="text" id="name"
            placeholder="Enter your full name"
            maxlength="50" required>

        <label>Email Address:</label>
        <input type="email" id="email"
            placeholder="example@gmail.com" required>

        <label>Mobile Number:</label>
        <input type="tel" id="mobile"
            placeholder="Enter 10 digit mobile number"
            maxlength="10" required>

        <label>Date of Birth:</label>
        <input type="date" id="dob"
            min="1900-01-01" required>

        <label>Gender:</label>
        <div class="options">
            <input type="radio" name="gender" value="Male"> Male
            <input type="radio" name="gender" value="Female"> Female
            <input type="radio" name="gender" value="Other"> Other
        </div>

        <label>Blood Group:</label>
        <select id="blood" required>
            <option value="">Select Blood Group</option>
            <option>A+</option>
            <option>A-</option>
            <option>B+</option>
            <option>B-</option>
            <option>O+</option>
            <option>O-</option>
            <option>AB+</option>
            <option>AB-</option>
        </select>

        <label>Appointment Date:</label>
        <input type="date" id="appointment"
            required>

        <label>Department:</label>
        <select id="department" required>
            <option value="">Select Department</option>
            <option>Cardiology</option>
            <option>Neurology</option>
            <option>Orthopedics</option>
            <option>General Medicine</option>
            <option>Dermatology</option>
        </select>

        <label>Address:</label>
        <textarea id="address"
            placeholder="Enter your address"
            maxlength="200" required></textarea>

        <label>Password:</label>
        <input type="password" id="password"
            placeholder="Create password" required>

        <label>Confirm Password:</label>
        <input type="password" id="confirmPassword"
            placeholder="Re-enter password" required>

        <label>Upload Medical Report:</label>
        <input type="file" id="report"
            accept=".pdf,.jpg,.jpeg,.png">

        <label>
            <input type="checkbox" id="terms" required
                style="width:auto;">
            I agree to the terms and conditions.
        </label>

        <button type="submit">Register Patient</button>

        <p id="message"></p>

    </form>
</div>

<script>

document.getElementById("patientForm")
.addEventListener("submit", function(event) {

    event.preventDefault();

    let name = document.getElementById("name").value.trim();
    let email = document.getElementById("email").value.trim();
    let mobile = document.getElementById("mobile").value.trim();
    let dob = document.getElementById("dob").value;
    let appointment = document.getElementById("appointment").value;
    let blood = document.getElementById("blood").value;
    let department = document.getElementById("department").value;
    let address = document.getElementById("address").value.trim();
    let password = document.getElementById("password").value;
    let confirmPassword = document.getElementById("confirmPassword").value;

    let message = document.getElementById("message");

    // Regular Expressions
    let namePattern = /^[A-Za-z]+(?:[ '-][A-Za-z]+)*$/;
    let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    let mobilePattern = /^[6-9]\d{9}$/;
    let passwordPattern = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,20}$/;

    // Name validation
    if (!namePattern.test(name)) {
        message.innerHTML = "Please enter a valid name.";
        message.className = "error";
        return;
    }

    // Email validation
    if (!emailPattern.test(email)) {
        message.innerHTML = "Please enter a valid email address.";
        message.className = "error";
        return;
    }

    // Mobile validation
    if (!mobilePattern.test(mobile)) {
        message.innerHTML = "Enter a valid 10-digit mobile number.";
        message.className = "error";
        return;
    }

    // Mandatory field validation
    if (!dob || !blood || !appointment ||
        !department || address === "") {
        message.innerHTML = "Please fill all mandatory fields.";
        message.className = "error";
        return;
    }

    // Date validation
    let today = new Date().toISOString().split("T")[0];

    if (dob > today) {
        message.innerHTML = "Date of birth cannot be in the future.";
        message.className = "error";
        return;
    }

    if (appointment < today) {
        message.innerHTML = "Appointment date cannot be in the past.";
        message.className = "error";
        return;
    }

    // Gender validation
    let gender = document.querySelector(
        'input[name="gender"]:checked'
    );

    if (!gender) {
        message.innerHTML = "Please select your gender.";
        message.className = "error";
        return;
    }

    // Password strength validation
    if (!passwordPattern.test(password)) {
        message.innerHTML =
            "Password must contain uppercase, lowercase, number and special character (8-20 characters).";
        message.className = "error";
        return;
    }

    // Confirm password validation
    if (password !== confirmPassword) {
        message.innerHTML = "Passwords do not match.";
        message.className = "error";
        return;
    }

    // Terms validation
    if (!document.getElementById("terms").checked) {
        message.innerHTML = "Please accept the terms and conditions.";
        message.className = "error";
        return;
    }

    // File validation
    let file = document.getElementById("report").files[0];

    if (file) {
        let allowedTypes = [
            "application/pdf",
            "image/jpeg",
            "image/png"
        ];

        if (!allowedTypes.includes(file.type)) {
            message.innerHTML = "Only PDF, JPG and PNG files are allowed.";
            message.className = "error";
            return;
        }

        if (file.size > 5 * 1024 * 1024) {
            message.innerHTML = "File size must be less than 5 MB.";
            message.className = "error";
            return;
        }
    }

    // Successful registration
    message.innerHTML =
        "Patient Registration Successful!";
    message.className = "success";

    document.getElementById("patientForm").reset();

});

</script>

</body>
</html>
