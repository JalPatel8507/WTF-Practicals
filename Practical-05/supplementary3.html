
<!DOCTYPE html>
<html>
<head>
    <title>Online Event Registration</title>
    <link rel="stylesheet" href="supplementary3.css">
</head>
<body>

    <div class="container">
        <h1>Online Event Registration</h1>

        <form id="eventForm">

            <h2>Participant Details</h2>

            <label>Full Name:</label>
            <input type="text" id="name" placeholder="Enter your name" required>

            <label>Email Address:</label>
            <input type="email" id="email" placeholder="Enter your email" required>

            <label>Mobile Number:</label>
            <input type="text" id="mobile" placeholder="10-digit mobile number" required>

            <label>Event Name:</label>
            <select id="event" required>
                <option value="">Select Event</option>
                <option>Technical Workshop</option>
                <option>Annual Cultural Fest</option>
                <option>Sports Competition</option>
                <option>Music Concert</option>
            </select>

            <h2>Payment Information</h2>

            <label>Payment Method:</label>
            <select id="payment" required>
                <option value="">Select Payment Method</option>
                <option>UPI</option>
                <option>Debit Card</option>
                <option>Credit Card</option>
                <option>Net Banking</option>
            </select>

            <label>Registration Amount (₹):</label>
            <input type="number" id="amount" min="1" placeholder="Enter amount" required>

            <button type="submit">Register Now</button>

        </form>

        <div id="message"></div>
    </div>

    <script src="supplementary3.js"></script>
</body>
</html>
