
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Information Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Student Information Management System</h1>
        <p>Manage student records easily</p>

        <form id="studentForm">
            <input type="hidden" id="editIndex">

            <input type="text" id="name" placeholder="Student Name" required>

            <input type="text" id="enrollment" placeholder="Enrollment Number" required>

            <input type="email" id="email" placeholder="Email Address" required>

            <input type="text" id="branch" placeholder="Branch" required>

            <input type="number" id="semester" placeholder="Semester" min="1" max="8" required>

            <button type="submit" id="submitBtn">Add Student</button>
        </form>

        <input type="text" id="search" placeholder="Search students...">

        <h2>Student Records</h2>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Enrollment</th>
                        <th>Email</th>
                        <th>Branch</th>
                        <th>Semester</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="studentList"></tbody>
            </table>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
