
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Employee Management System</h1>
        <p>Manage employee records using MySQL Database</p>

        <form id="employeeForm">
            <input type="hidden" id="employeeId">

            <input type="text" id="name" placeholder="Employee Name" required>

            <input type="email" id="email" placeholder="Email Address" required>

            <input type="text" id="department" placeholder="Department" required>

            <input type="number" id="salary" placeholder="Salary" min="1" required>

            <button type="submit" id="submitBtn">Add Employee</button>
        </form>

        <h2>Employee Records</h2>

        <input type="text" id="search" placeholder="Search employees...">

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Department</th>
                        <th>Salary</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="employeeList"></tbody>
            </table>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
